# This rule is not used by the project swagger-operator itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants permissions to create, update, and delete resources within the kong.kong.swagger.com.
# This role is intended for users who need to manage these resources
# but should not control RBAC or manage permissions for others.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: swagger-operator
    app.kubernetes.io/managed-by: kustomize
  name: swaggerkong-editor-role
rules:
- apiGroups:
  - kong.swagger.com
  resources:
  - swaggerkongs
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - kong.swagger.com
  resources:
  - swaggerkongs/status
  verbs:
  - get
