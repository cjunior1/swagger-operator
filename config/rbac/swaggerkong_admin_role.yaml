# This rule is not used by the project swagger-operator itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants full permissions ('*') over kong.kong.swagger.com.
# This role is intended for users authorized to modify roles and bindings within the cluster,
# enabling them to delegate specific permissions to other users or groups as needed.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: swagger-operator
    app.kubernetes.io/managed-by: kustomize
  name: swaggerkong-admin-role
rules:
- apiGroups:
  - kong.kong.swagger.com
  resources:
  - swaggerkongs
  verbs:
  - '*'
- apiGroups:
  - kong.swagger.com
  resources:
  - swaggerkongs/status
  verbs:
  - get
