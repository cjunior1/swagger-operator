# This rule is not used by the project swagger-operator itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants read-only access to kong.kong.swagger.com resources.
# This role is intended for users who need visibility into these resources
# without permissions to modify them. It is ideal for monitoring purposes and limited-access viewing.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: swagger-operator
    app.kubernetes.io/managed-by: kustomize
  name: swaggerkong-viewer-role
rules:
- apiGroups:
  - kong.swagger.com
  resources:
  - swaggerkongs
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - kong.swagger.com
  resources:
  - swaggerkongs/status
  verbs:
  - get
